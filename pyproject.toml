[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgar13f"
version = "1.2.0"
description = "MCP server (stdio) over SEC Form 13F-HR filings with point-in-time correctness"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["mcp>=2.0,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
edgar13f-server = "edgar13f.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
