name: publish

# Stage 6 (rulings P14 un-deferred, P16; REGISTER 2026-10-18). Runs only when the owner publishes a GitHub
# release; the `pypi` job also waits for the owner's approval of the `pypi` environment. No secrets: PyPI
# trusted publishing and the MCP Registry's GitHub OIDC login both use the job's OIDC token.
on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Release tag must equal v + pyproject version + both server.json versions
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import json, os, tomllib
          tag = os.environ["TAG"]
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          server = json.load(open("server.json"))
          found = {"tag": tag, "pyproject": "v" + project,
                   "server.json version": "v" + server["version"],
                   "server.json packages[0].version": "v" + server["packages"][0]["version"]}
          print(found)
          if len(set(found.values())) != 1:
              raise SystemExit("version mismatch: " + str(found))
          PY
      - name: Build sdist and wheel, then twine check
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build --outdir dist .
          twine check dist/*
          ls -l dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi          # the owner approves here (required reviewer; tag rule v*)
    permissions:
      id-token: write          # PyPI trusted publishing; no token
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  registry:
    needs: pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      id-token: write          # mcp-publisher login github-oidc
      contents: read
    env:
      MCP_PUBLISHER_VERSION: "1.8.1"
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install mcp-publisher at an exact version (SHA-256 checked)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/mcp-publisher.tgz" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  $RUNNER_TEMP/mcp-publisher.tgz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tgz" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" --version
      - name: Wait (bounded, 10 min) until PyPI serves the new version
        run: |
          version="$(python3 -c 'import json; print(json.load(open("server.json"))["packages"][0]["version"])')"
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null "https://pypi.org/pypi/edgar13f-mcp/${version}/json"; then
              echo "PyPI serves edgar13f-mcp ${version} (attempt ${attempt})"; exit 0
            fi
            echo "attempt ${attempt}: not on PyPI yet"; sleep 20
          done
          echo "edgar13f-mcp ${version} not served by PyPI after 10 minutes"; exit 1
      - name: Log in with GitHub OIDC and publish server.json
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish
